laravel: './workbench'

providers:
    - Frolax\Bedrock\BedrockServiceProvider
    - Frolax\Bedrock\Providers\SpatieAccessServiceProvider
    - Frolax\Bedrock\Providers\FrontendServiceProvider
    - Frolax\Bedrock\Providers\AdministrationServiceProvider

migrations:
    - workbench/database/migrations

seeders:
    - Workbench\Database\Seeders\DatabaseSeeder

workbench:
    start: '/'
    install: true
    health: false
    discovers:
        web: true
        api: true
        commands: true
        components: false
        factories: true
        views: false
        config: true
    build:
        - asset-publish
        - create-sqlite-db
        - db-wipe
        - migrate-fresh
    assets:
        - laravel-assets
